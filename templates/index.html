<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ToDoアプリ</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 追加の自作CSS（任意） -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:,"> <!-- 簡易favicon（不要なら削除） -->
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">📝 ToDo</a>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-7">

        <!-- カード -->
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="h3 mb-4 text-center">ToDoリスト</h1>

            <!-- 追加フォーム -->
            <form method="POST" action="/add" class="row g-2 mb-4" autocomplete="off">
              <div class="col-9 col-sm-10">
                <input type="text" name="task" class="form-control" placeholder="タスクを入力" required>
              </div>
              <div class="col-3 col-sm-2 d-grid">
                <button type="submit" class="btn btn-primary">追加</button>
              </div>
            </form>

            <!-- タスクリスト -->
            {% if tasks|length > 0 %}
              <ul class="list-group">
                {% for task in tasks %}
                  <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span class="text-wrap">{{ task[1] }}</span>
                    <!-- GET のままでもOK。より安全にするなら method=POST に変更検討 -->
                    <a href="/delete/{{ task[0] }}" class="btn btn-sm btn-outline-danger">削除</a>
                  </li>
                {% endfor %}
              </ul>
            {% else %}
              <div class="text-center text-muted py-3">
                まだタスクがありません。上のフォームから追加してください。
              </div>
            {% endif %}
          </div>
        </div>

        <!-- フッター -->
        <p class="text-center text-muted mt-3 mb-0" style="font-size:.9rem;">
          Built with Flask + SQLite
        </p>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS（必要ならModal等で使用） -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
